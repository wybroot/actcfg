# 仅依赖服务：MySQL + Redis + MinIO
# 适合在本地直接运行后端 jar（IDEA/命令行），但想用真实数据库而不是纯内存
#
# 用法：
#   cp .env.example .env        # 填写真实密码
#   docker compose -f docker-compose.deps.yml up -d
#   # 然后在 IDE 或命令行以 local profile 启动后端
#   java -jar backend/target/delivery-platform-0.1.0-SNAPSHOT.jar \
#        --spring.profiles.active=local

services:
  mysql:
    image: mysql:8.0
    container_name: delivery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-delivery_platform}
      MYSQL_USER:          ${MYSQL_USER:-delivery}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: delivery-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 首次启动自动创建所需 Bucket（执行一次即退出）
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: delivery-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing myminio/delivery-resources &&
        mc mb --ignore-existing myminio/delivery-packages &&
        mc mb --ignore-existing myminio/delivery-agent &&
        mc mb --ignore-existing myminio/delivery-reports &&
        echo 'MinIO buckets ready.'
      "
    restart: "no"

volumes:
  mysql_data:
  redis_data:
  minio_data:
